<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签类型</title>
    <style>
        .top {
            width: 100%;
            height: 60px;
            background-color: rgb(244, 235, 235);
            margin:10px auto;
        }
        #nav {
            width: 270px;
            height: 129px;
            background-color: white;
            margin:0 auto;
        }
        .nav_top {
            font-size: 14px;
            color: #222;
            padding-left: 10px;
        }
        #nav img {
            width: 270px;
            height: 129px;
        }
        .nav_top a {
            color: #222;
            text-decoration: none;
        }
        .nav_top a:visited {
            color: #222;
        }
        .nav_top a:hover {
            text-decoration: underline;
            color: #4bb4f5;
        }
        .form {
            width: 680px;
            height: 80px;
            border: 1px solid #844dd7;
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <div class="top">
        <span class="nav_top"><a href="#">新闻</a></span>
        <span class="nav_top"><a href="#">hao123</a></span>
        <span class="nav_top"><a href="#">地图</a></span>
    </div>
    <div id="nav">
        <img src="baidu_logo.png"/>
    </div>
    <div class="form">
        暂无内容
    </div>
    
</body>
</html>
